spring.application.name=iot-backend
server.port=8080

# Sustituir por la URI de Atlas (usuario y contraseña reales)
spring.data.mongodb.uri=mongodb+srv://usuario_iot:<password>@cluster0.xxxxx.mongodb.net/?appName=Cluster0
spring.data.mongodb.database=iot_db

spring.main.allow-bean-definition-overriding=true

mqtt.broker.url=tcp://broker.emqx.io:1883
mqtt.client.id=spring-backend-client
mqtt.topic=ingenieria/iot/temperatura

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.com.tuuniversidad.iot=DEBUG
logging.level.org.springframework.integration=INFO
logging.level.org.springframework.data.mongodb=INFO
